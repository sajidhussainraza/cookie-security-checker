<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Cookie Security Checker banner</title>
  <desc id="desc">Dark navy banner with a glowing teal shield protecting a cookie, the project name Cookie Security Checker, its tagline, and Cyber Legends.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2A4A"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <!-- circuit traces -->
  <g stroke="#2DD4BF" stroke-width="2" fill="none" opacity="0.35">
    <polyline points="820,80 900,80 900,140"/>
    <polyline points="1180,120 1100,120 1100,200"/>
    <polyline points="760,520 860,520 860,460"/>
    <polyline points="1220,480 1140,480 1140,420"/>
    <polyline points="700,180 760,180 760,240"/>
  </g>
  <g fill="#2DD4BF" opacity="0.6">
    <circle cx="820" cy="80" r="5"/>
    <circle cx="900" cy="140" r="5"/>
    <circle cx="1180" cy="120" r="5"/>
    <circle cx="760" cy="520" r="5"/>
    <circle cx="1220" cy="480" r="5"/>
  </g>
  <!-- binary texture -->
  <g font-family="monospace" font-size="22" fill="#2DD4BF" opacity="0.14">
    <text x="640" y="120">0 1 1 0 1 0 0 1</text>
    <text x="660" y="560">1 0 0 1 0 1 1 0</text>
    <text x="1120" y="300">1 0 1</text>
  </g>
  <!-- shield -->
  <path d="M960,105 L1145,175 V330 C1145,455 1060,545 960,585 C860,545 775,455 775,330 V175 Z"
        fill="#123252" stroke="#2DD4BF" stroke-width="6" stroke-linejoin="round"/>
  <path d="M960,135 L1115,195 V330 C1115,435 1045,515 960,552 C875,515 805,435 805,330 V195 Z"
        fill="none" stroke="#2DD4BF" stroke-width="2" opacity="0.5"/>
  <!-- cookie -->
  <circle cx="960" cy="330" r="98" fill="#2DD4BF"/>
  <g fill="#0B1F3A" opacity="0.55">
    <circle cx="910" cy="290" r="10"/>
    <circle cx="1000" cy="280" r="8"/>
    <circle cx="1015" cy="370" r="11"/>
    <circle cx="905" cy="375" r="7"/>
    <circle cx="960" cy="255" r="6"/>
  </g>
  <!-- padlock -->
  <rect x="922" y="330" width="76" height="62" rx="9" fill="#0B1F3A"/>
  <path d="M934,330 v-18 a26,26 0 0 1 52,0 v18" fill="none" stroke="#0B1F3A" stroke-width="9"/>
  <circle cx="960" cy="354" r="9" fill="#2DD4BF"/>
  <rect x="956" y="358" width="8" height="16" rx="4" fill="#2DD4BF"/>
  <!-- text -->
  <text x="70" y="270" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" fill="#F8FAFC">Cookie Security</text>
  <text x="70" y="355" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" fill="#F8FAFC">Checker</text>
  <text x="70" y="420" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#2DD4BF">Audit any site&#8217;s cookies and grade their security in seconds.</text>
  <text x="70" y="475" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="5" fill="#94A3B8">CYBER LEGENDS</text>
</svg>
